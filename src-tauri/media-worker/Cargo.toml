[package]
name = "myagents-media-worker"
version = "0.4.10"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "myagents_media_worker"
path = "src/lib.rs"

[[bin]]
name = "myagents-media-worker"
path = "src/main.rs"

[dependencies]
libloading = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
