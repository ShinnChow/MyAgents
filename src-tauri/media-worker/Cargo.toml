[package]
name = "myagents-media-worker"
version = "0.4.10"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "myagents_media_worker"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
